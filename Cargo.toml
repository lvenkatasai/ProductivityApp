[workspace]
members = ["crates/core", "crates/store", "crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Productivity OS Team"]

[workspace.dependencies]
# Core domain logic
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
thiserror = "1.0"
ts-rs = "8.1"
once_cell = "1.19"
parking_lot = "0.12"
